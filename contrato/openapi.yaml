          description: Estado civil del funcionario.
        fecha_ingreso:
          type: string
          format: date
          description: Fecha en que el funcionario ingresó a la empresa.
        direccion:
          type: string
          description: Dirección de residencia del funcionario.
        ciudad_id:
          type: integer
          description: ID de la ciudad donde reside el funcionario.
        correo_electronico:
          type: string
          format: email
          description: Correo electrónico del funcionario.
        fecha_ingreso_seguro_social:
          type: string
          format: date
          description: Fecha de ingreso al seguro social.
        fecha_egreso:
          type: string
          format: date
          description: Fecha de egreso de la empresa.
        estado:
          type: string
          enum:
            - activo
            - inactivo
          description: Estado actual del funcionario.
        numero_cuenta_bancaria:
          type: string
          description: Número de cuenta bancaria del funcionario.
        tipo_contrato_id:
          type: integer
          description: ID del tipo de contrato.
        cargo_id:
          type: integer
          description: ID del cargo actual.
        fecha_asuncion_cargo:
          type: string
          format: date
          description: Fecha de inicio en el cargo actual.
        horario_ingreso:
          type: string
          format: time
          description: Horario de ingreso.
        horario_salida:
          type: string
          format: time
          description: Horario de salida.
        dias_laborales:
          type: string
          description: Días laborables de la semana.
        telefono:
          type: string
          description: Número de teléfono.
        contacto_emergencia:
          type: string
          description: Contacto de emergencia.

    Hijo:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: ID único del registro del hijo.
        funcionario_id:
          type: integer
          description: ID del funcionario asociado al hijo.
        nombre:
          type: string
          description: Nombre del hijo.
        fecha_nacimiento:
          type: string
          format: date
          description: Fecha de nacimiento del hijo.
        documento:
          type: string
          description: Número de documento de identificación del hijo.
        apto_bonificacion:
          type: boolean
          description: Indica si el hijo es apto para bonificaciones.
      required:
        - funcionario_id
        - nombre
        - fecha_nacimiento

    HijoPost:
      type: object
      properties:
        funcionario_id:
          type: integer
          description: ID del funcionario asociado al hijo.
        nombre:
          type: string
          description: Nombre del hijo.
        fecha_nacimiento:
          type: string
          format: date
          description: Fecha de nacimiento del hijo.
        documento:
          type: string
          description: Número de documento de identificación del hijo.
        apto_bonificacion:
          type: boolean
          description: Indica si el hijo es apto para bonificaciones.
      required:
        - funcionario_id
        - nombre
        - fecha_nacimiento

    HijoPatch:
      type: object
      properties:
        funcionario_id:
          type: integer
          description: ID del funcionario asociado al hijo.
        nombre:
          type: string
          description: Nombre del hijo.
        fecha_nacimiento:
          type: string
          format: date
          description: Fecha de nacimiento del hijo.
        documento:
          type: string
          description: Número de documento de identificación del hijo.
        apto_bonificacion:
          type: boolean
          description: Indica si el hijo es apto para bonificaciones.