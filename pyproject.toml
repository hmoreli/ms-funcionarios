[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ms-funcionarios"
version = "0.1.0"
description = "Microservicio de Gestión de Funcionarios"
requires-python = ">=3.11"
dependencies = [
    # Se instala desde el repo hermano ../rrhh-common (ver README).
    "rrhh-common[db]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "email-validator>=2.1",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Depends() en argumentos por defecto es el idiom de FastAPI.
ignore = ["B008"]
